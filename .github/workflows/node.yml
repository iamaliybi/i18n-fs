name: Node

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: wasm, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Also enforces the per-target gzip budgets. The Edge build is the one
      # that matters: it runs on every request, and nothing should quietly grow
      # it. See docs/adr/0001-wasm-boundary.md.
      - name: Build WASM (all three targets)
        run: pnpm wasm:build

      - name: Sync WASM into the package
        run: pnpm wasm:sync

      - name: Typecheck
        run: pnpm typecheck

      - name: Build package
        run: pnpm build

      - name: Test
        run: pnpm test

      # The published layout differs from the source layout: `package.json`
      # imports resolve to `dist`, and the Node glue needs its CommonJS marker.
      # Importing the built output is the only way to catch a break in either.
      - name: Smoke-test the built package
        working-directory: packages/i18n-fs
        run: |
          node --input-type=module -e "
            const { loadFullCore } = await import('./dist/index.js');
            const core = await loadFullCore();
            if (!/^\d+\.\d+\.\d+$/.test(core.coreVersion())) {
              throw new Error('unexpected core version');
            }
            console.log('built package loads:', core.coreVersion());
          "

      # The 'use client' directive and the shebang are restored by a post-build
      # step because esbuild strips both. Neither is covered by a unit test, and
      # losing either breaks the package silently.
      - name: Check the built entry points
        working-directory: packages/i18n-fs
        run: |
          set -e
          head -n 1 dist/cli/main.js | grep -q '^#!/usr/bin/env node'
          head -n 1 dist/client/index.js | grep -q "^'use client';"
          head -n 1 dist/navigation.js | grep -q "^'use client';"
          # Both must import the client boundary rather than inlining it. An
          # inlined copy means a second React context, which shows up as
          # "No I18nProvider found" on a page that plainly has one.
          grep -q "from 'i18n-fs/client'" dist/server/index.js
          grep -q "from 'i18n-fs/client'" dist/navigation.js
          test "$(grep -c 'createContext' dist/navigation.js)" = "0"
          echo 'entry points look right'

      # The unit tests import the CLI's functions; this runs the actual binary,
      # which is the only thing that covers the shebang, argument parsing and
      # exit codes.
      - name: Smoke-test the built CLI
        run: |
          set -e
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/public/locales/fa" "$fixture/public/locales/en"
          printf 'export default { locales: ["fa", "en"], defaultLocale: "fa" };\n' \
            > "$fixture/i18n-fs.config.mjs"
          echo '{"hero":{"title":"a","bullets":["x"]}}' > "$fixture/public/locales/fa/home.json"
          echo '{"hero":{"title":"b","bullets":["y"]}}' > "$fixture/public/locales/en/home.json"

          node packages/i18n-fs/dist/cli/main.js build --cwd "$fixture" --strict
          test -f "$fixture/.i18n-fs/messages.d.ts"
          test -f "$fixture/.i18n-fs/manifest.json"
          test -f "$fixture/.i18n-fs/config.mjs"

          # A missing key must fail the build, not warn.
          echo '{"hero":{"title":"b"}}' > "$fixture/public/locales/en/home.json"
          if node packages/i18n-fs/dist/cli/main.js check --cwd "$fixture"; then
            echo 'expected check to fail on a missing key'
            exit 1
          fi

  example:
    name: example app and end-to-end routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm wasm:build
      - run: pnpm wasm:sync
      - run: pnpm build

      # pnpm creates a package's bin shims by looking at the file the `bin`
      # field points at, and `dist/cli/main.js` does not exist during the first
      # install. A second install alone is not enough — pnpm sees an up-to-date
      # tree and does nothing — so the tree is cleared first.
      - name: Link the CLI now that it exists
        run: |
          node scripts/relink.mjs
          pnpm install --frozen-lockfile

      # The example is part of the test suite, not a sample. It is the only
      # place the real matcher, the real Edge runtime and the real WebAssembly
      # binary meet — and every one of those has already failed here in a way no
      # unit test could see.
      - name: Build the example
        run: pnpm example

      - name: End-to-end routing
        run: pnpm example:test
