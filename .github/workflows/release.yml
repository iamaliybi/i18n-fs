name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance.
  id-token: write

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    # Promoted to `env` because the `secrets` context is not available in a
    # step's `if:` — only in `with:`. Referencing it there makes the whole
    # workflow file invalid, which GitHub reports as a failed run with no jobs
    # and no log, on every branch rather than just this workflow's own.
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs the history to work out what changed.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The published package contains compiled WebAssembly, so the release job
      # has to build it rather than trusting an artefact from another workflow.
      - name: Build everything
        run: |
          npm run wasm:build
          npm run wasm:sync
          npm run build

      - name: Note that publishing is disabled
        if: env.HAS_NPM_TOKEN != 'true'
        run: |
          echo "::warning::NPM_TOKEN is not set. The version pull request will           still be opened or updated, but nothing will be published."

      # Opens a "Version Packages" pull request when changesets are pending, and
      # publishes when that pull request is merged. `changeset publish` also
      # creates the git tag, so the tag can never name a version that was not
      # actually published.
      #
      # Publishing is left out entirely when there is no credential. Versioning
      # is the useful half and it needs nothing; failing the whole job over a
      # missing secret would put a red cross on `main` for a state that is
      # perfectly valid before the first release.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          publish: ${{ env.HAS_NPM_TOKEN == 'true' && 'npm run changeset:publish' || '' }}
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
