name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance.
  id-token: write

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs the history to work out what changed.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The published package contains compiled WebAssembly, so the release job
      # has to build it rather than trusting an artefact from another workflow.
      - name: Build everything
        run: |
          pnpm wasm:build
          pnpm wasm:sync
          pnpm build

      - name: Note that publishing is disabled
        if: ${{ !secrets.NPM_TOKEN }}
        run: |
          echo "::warning::NPM_TOKEN is not set. The version pull request will           still be opened or updated, but nothing will be published."

      # Opens a "Version Packages" pull request when changesets are pending, and
      # publishes when that pull request is merged. `changeset publish` also
      # creates the git tag, so the tag can never name a version that was not
      # actually published.
      #
      # Publishing is left out entirely when there is no credential. Versioning
      # is the useful half and it needs nothing; failing the whole job over a
      # missing secret would put a red cross on `main` for a state that is
      # perfectly valid before the first release.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: ${{ secrets.NPM_TOKEN && 'pnpm changeset publish' || '' }}
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
