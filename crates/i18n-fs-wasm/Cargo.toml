[package]
name = "i18n-fs-wasm"
description = "WebAssembly bindings for i18n-fs-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Two independent halves, because the three consumers need different pairs of
# them: the proxy routes but never resolves messages, the browser resolves
# messages but never routes, and only Node does both. Nothing here is additive
# for its own sake — a function compiled in is bytes downloaded.
default = ["full", "routing"]
# Locale negotiation, route canonicalisation and config validation.
routing = []
# Message storage and formatting.
full = ["i18n-fs-core/full", "diagnostics"]
diagnostics = ["i18n-fs-core/diagnostics"]
cli = ["full", "i18n-fs-core/cli"]

[dependencies]
i18n-fs-core = { path = "../i18n-fs-core", default-features = false }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

# rustc emits the WASM 2.0 baseline (sign-ext, bulk-memory,
# nontrapping-float-to-int, ...) by default, but the wasm-opt that wasm-pack
# ships predates it and rejects those instructions. Enable them explicitly
# rather than turning size optimisation off.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-bulk-memory",
    "--enable-multivalue",
    "--enable-reference-types",
]
